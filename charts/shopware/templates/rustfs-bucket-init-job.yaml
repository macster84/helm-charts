{{- if .Values.rustfs.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-rustfs-bucket-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rustfs-bucket-init
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-bucket-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-buckets
        image: rustfs/rc:latest
        command: ["sh", "-c"]
        args:
        - |
          set -e
          echo "Waiting for RustFS to be ready..."
          until rc alias set rustfs http://{{ .Release.Name }}-rustfs-svc.{{ .Release.Namespace }}.svc.cluster.local:9000 $RUSTFS_ACCESS_KEY $RUSTFS_SECRET_KEY; do
            echo "RustFS not ready yet, waiting..."
            sleep 5
          done

          echo "Creating shopware-private bucket..."
          rc bucket create --ignore-existing rustfs/shopware-private

          echo "Creating shopware-public bucket..."
          rc bucket create --ignore-existing rustfs/shopware-public

          echo "Setting public read policy on shopware-public bucket..."
          cat > /tmp/anonymous-download-policy.json <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"AWS": ["*"]},
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::shopware-public/*"]
              }
            ]
          }
          POLICY
          rc bucket anonymous set-json /tmp/anonymous-download-policy.json rustfs/shopware-public

          echo "Buckets created successfully!"
          rc bucket list rustfs
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rustfs-secret
              key: RUSTFS_ACCESS_KEY
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-rustfs-secret
              key: RUSTFS_SECRET_KEY
{{- end }}
